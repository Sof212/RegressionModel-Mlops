
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Build and publish Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t regressionmodel-mlops:ci .

      - name: Start API container
        run: docker run -d --name regression-api -p 8000:8000 regressionmodel-mlops:ci

      - name: Test API
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/; then
              echo "API is working!"
              exit 0
            fi
            sleep 2
          done
          docker logs regression-api
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f regression-api || true

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag regressionmodel-mlops:ci \
            "$DOCKERHUB_USERNAME/regressionmodel-mlops:latest"
          docker tag regressionmodel-mlops:ci \
            "$DOCKERHUB_USERNAME/regressionmodel-mlops:$GITHUB_SHA"

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push "$DOCKERHUB_USERNAME/regressionmodel-mlops:latest"
          docker push "$DOCKERHUB_USERNAME/regressionmodel-mlops:$GITHUB_SHA"
